<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Studio — Afroza Riju portfolio admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#161618">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <!-- Auth / gate screens -->
  <main class="gate" id="gate">
    <div class="gate__card">
      <div class="gate__brand">
        <svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect x="4.5" y="4.5" width="31" height="31" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="2" y="2" width="5" height="5" fill="var(--c-accent)"/><rect x="33" y="2" width="5" height="5" fill="var(--c-accent)"/><rect x="2" y="33" width="5" height="5" fill="var(--c-accent)"/><rect x="33" y="33" width="5" height="5" fill="var(--c-accent)"/><text x="20" y="25.5" text-anchor="middle" font-family="Geist, sans-serif" font-weight="700" font-size="13" fill="currentColor">AR</text></svg>
        <span>Studio</span>
      </div>
      <div id="gateBody"><p class="muted">Loading…</p></div>
    </div>
  </main>

  <!-- App shell -->
  <div class="shell" id="shell" hidden>
    <aside class="side">
      <div class="side__brand">
        <svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true"><rect x="4.5" y="4.5" width="31" height="31" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="2" y="2" width="5" height="5" fill="var(--c-accent)"/><rect x="33" y="2" width="5" height="5" fill="var(--c-accent)"/><rect x="2" y="33" width="5" height="5" fill="var(--c-accent)"/><rect x="33" y="33" width="5" height="5" fill="var(--c-accent)"/></svg>
        <span>Studio</span>
      </div>
      <nav class="side__nav" id="sideNav" aria-label="Admin sections"></nav>
      <div class="side__foot">
        <a class="side__link" href="../index.html" target="_blank" rel="noopener">View site</a>
        <button class="side__link" type="button" id="signOut">Sign out</button>
        <p class="side__user" id="userEmail"></p>
      </div>
    </aside>
    <main class="main" id="view" tabindex="-1"></main>
  </div>

  <!-- Editor drawer -->
  <dialog class="drawer" id="drawer" aria-labelledby="drawerTitle">
    <form class="drawer__form" id="drawerForm" novalidate>
      <header class="drawer__head">
        <h2 id="drawerTitle">Edit</h2>
        <button class="icon-btn" type="button" data-close aria-label="Close editor">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </header>
      <div class="drawer__body" id="drawerBody"></div>
      <footer class="drawer__foot">
        <span class="drawer__status" id="drawerStatus" role="status" aria-live="polite"></span>
        <button class="a-btn" type="button" data-close>Cancel</button>
        <button class="a-btn a-btn--primary" type="submit" id="drawerSave"><span>Save changes</span><i class="a-spin" aria-hidden="true"></i></button>
      </footer>
    </form>
  </dialog>

  <!-- Confirm dialog -->
  <dialog class="confirm" id="confirm" aria-labelledby="confirmTitle" aria-describedby="confirmBody">
    <h2 id="confirmTitle"></h2>
    <p id="confirmBody"></p>
    <div class="confirm__actions">
      <button class="a-btn" type="button" id="confirmCancel">Cancel</button>
      <button class="a-btn a-btn--primary" type="button" id="confirmOk">Confirm</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./admin.js"></script>
</body>
</html>
